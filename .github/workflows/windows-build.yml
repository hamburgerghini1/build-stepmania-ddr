on:
  push:
  pull_request:
  workflow_dispatch:  # This enables the manual trigger

name: Continuous integration

jobs:
  windows-build-bundled:
    name: "Windows: Build with bundled libraries"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -B build
      - name: Build
        run: cmake --build build --parallel "$env:NUMBER_OF_PROCESSORS"
